# PR: 테스트 / develop·main push: 테스트 후 이미지를 GHCR에 올린다 (태그 = 커밋 SHA)
# develop 이미지 → 온프렘, main 이미지 → AWS (README)
# develop push는 이미지를 올린 뒤 infra 저장소 deploy-onprem workflow를 부른다 (온프렘 자동 배포)
# 이미지 주소: ghcr.io/<owner>/<repo>:<커밋 SHA> (소문자)
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # 테스트는 로컬과 같은 compose의 MySQL(3307)·Redis를 쓴다
      - run: docker compose up -d --wait mysql redis
      - run: ./gradlew test --console=plain

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # GHCR 이미지 이름은 소문자여야 한다
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
      - run: echo "이미지 ${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: 온프렘 배포 요청 (develop만)
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          gh api repos/Team-likelion-3rd-Project/likelion-devops-7th-3rd-team01-infra/dispatches \
            -f event_type=deploy-onprem \
            -f "client_payload[app]=backend" \
            -f "client_payload[sha]=${GITHUB_SHA}"
          echo "온프렘 배포 요청: backend ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
